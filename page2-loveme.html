<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me? 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#2e1a2b; --wine:#6b2d43; --blush:#f0d3d3; --rose:#d98d96; --gold:#e3b873; --cream:#faf1e8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    min-height:100%; height:100%;
    background:
      radial-gradient(ellipse 60% 50% at 15% 0%, rgba(227,184,115,0.14), transparent 60%),
      radial-gradient(ellipse 70% 60% at 85% 100%, rgba(107,45,67,0.45), transparent 60%),
      linear-gradient(160deg, #2e1a2b 0%, #201320 100%);
    font-family:'Jost', sans-serif;
    color:var(--cream);
    overflow-x:hidden;
  }
  .heart-field{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .heart-field svg{ position:absolute; opacity:0.07; animation:drift linear infinite; }
  @keyframes drift{ 0%{ transform:translateY(6vh) rotate(0deg); } 100%{ transform:translateY(-106vh) rotate(12deg); } }

  .stage{ position:relative; z-index:2; min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:40px 22px; }
  .panel{
    max-width:420px; width:100%; text-align:center;
    background:rgba(255,255,255,0.03); border:1px solid rgba(227,184,115,0.18);
    border-radius:28px; padding:44px 28px; backdrop-filter:blur(6px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  }
  .eyebrow{ font-size:11px; letter-spacing:0.35em; text-transform:uppercase; color:var(--gold); margin-bottom:18px; opacity:0.85; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:clamp(28px, 7vw, 40px); line-height:1.2; margin-bottom:34px; }
  h1 em{ font-style:italic; color:var(--rose); }

  .choice-row{ position:relative; display:flex; gap:16px; justify-content:center; min-height:60px; }
  button{
    font-family:'Jost', sans-serif; font-size:15px; letter-spacing:0.02em;
    padding:14px 34px; border-radius:999px; border:1px solid var(--gold);
    background:var(--gold); color:var(--plum); font-weight:500; cursor:pointer;
  }
  #noBtn{ background:transparent; color:var(--cream); border-color:rgba(247,236,226,0.4); position:relative; transition:left 0.25s ease, top 0.25s ease; }
  #noBtn.armed{ position:fixed; }
</style>
</head>
<body>

<div class="heart-field" id="heartField"></div>

<div class="stage">
  <div class="panel">
    <div class="eyebrow">just one question</div>
    <h1>Do you<br><em>love me?</em></h1>
    <div class="choice-row">
      <button onclick="location.href='page3-bouquet.html'">Yes 💗</button>
      <button id="noBtn" onmouseenter="dodge(event)" ontouchstart="dodge(event)" onclick="dodge(event)">No</button>
    </div>
  </div>
</div>

<script>
  const heartsContainer = document.getElementById('heartField');
  const HEART_PATH = "M12 21s-6.7-4.2-9.3-8.1C.6 9.9 1.6 6.4 4.6 5.1 6.7 4.2 9 5 10.3 6.8 11 7.7 12 9 12 9s1-1.3 1.7-2.2C15 5 17.3 4.2 19.4 5.1c3 1.3 4 4.8 1.9 7.8C18.7 16.8 12 21 12 21z";
  for(let i=0;i<20;i++){
    const size = 14 + Math.random()*28;
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", size); svg.setAttribute("height", size); svg.setAttribute("viewBox", "0 0 24 24");
    svg.style.left = (Math.random()*100) + "vw";
    svg.style.bottom = "-40px";
    svg.style.animationDuration = (22 + Math.random()*26) + "s";
    svg.style.animationDelay = (-Math.random()*40) + "s";
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", HEART_PATH);
    path.setAttribute("fill", Math.random() > 0.5 ? "#e3b873" : "#d98d96");
    svg.appendChild(path);
    heartsContainer.appendChild(svg);
  }

  const noBtn = document.getElementById('noBtn');
  function dodge(e){
    e.preventDefault();
    noBtn.classList.add('armed');
    const vw = window.innerWidth, vh = window.innerHeight;
    const btnW = noBtn.offsetWidth, btnH = noBtn.offsetHeight;
    const newX = Math.random() * (vw - btnW - 20) + 10;
    const newY = Math.random() * (vh - btnH - 20) + 10;
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
  }
</script>

</body>
</html>
