<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shrutu 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#2e1a2b; --wine:#6b2d43; --blush:#f0d3d3; --rose:#d98d96; --gold:#e3b873; --cream:#faf1e8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    min-height:100%;
    background:
      radial-gradient(ellipse 60% 50% at 15% 0%, rgba(227,184,115,0.14), transparent 60%),
      radial-gradient(ellipse 70% 60% at 85% 100%, rgba(107,45,67,0.45), transparent 60%),
      linear-gradient(160deg, #2e1a2b 0%, #201320 100%);
    font-family:'Jost', sans-serif;
    color:var(--cream);
  }
  .heart-field{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .heart-field svg{ position:absolute; opacity:0.07; animation:drift linear infinite; }
  @keyframes drift{ 0%{ transform:translateY(6vh) rotate(0deg); } 100%{ transform:translateY(-106vh) rotate(12deg); } }

  .stage{ position:relative; z-index:2; min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:40px 22px; }
  .panel{
    max-width:440px; width:100%; text-align:center;
    background:rgba(255,255,255,0.03); border:1px solid rgba(227,184,115,0.18);
    border-radius:28px; padding:36px 26px; backdrop-filter:blur(6px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  }
  .eyebrow{ font-size:11px; letter-spacing:0.35em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; opacity:0.85; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:clamp(30px, 7vw, 42px); line-height:1.2; margin-bottom:8px; }
  h1 em{ font-style:italic; color:var(--rose); }
  .sub{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:17px; color:var(--blush); opacity:0.9; margin:16px 0 26px; line-height:1.6; }
  .emoji-row{ font-size:32px; margin-bottom:6px; }

  .photo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
  .photo-grid img{
    width:100%; height:130px; object-fit:cover; border-radius:12px;
    border:2px solid rgba(255,255,255,0.7);
    box-shadow:0 10px 22px -6px rgba(0,0,0,0.5);
  }

  a.btn{
    display:inline-block; font-family:'Jost', sans-serif; font-size:14px; letter-spacing:0.03em;
    padding:14px 34px; border-radius:999px; background:var(--gold); color:var(--plum);
    font-weight:500; text-decoration:none;
  }
</style>
</head>
<body>

<div class="heart-field" id="heartField"></div>

<div class="stage">
  <div class="panel">
    <div class="emoji-row">🎉💗🎂</div>
    <div class="eyebrow">for my shrutu</div>
    <h1>Happy Birthday,<br><em>Shrutu</em></h1>
